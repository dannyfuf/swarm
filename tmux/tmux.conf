%if "#{==:$SWARM_ROOT,}"
SWARM_ROOT=$HOME/buk/swarm
%endif

unbind r
bind r source-file "$SWARM_ROOT/tmux/tmux.conf" \; display-message "swarm tmux config reloaded"

set -g prefix C-s

set -g mouse on

set-option -g status-position top

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "sh -c 'if command -v pbcopy >/dev/null 2>&1; then exec pbcopy; elif command -v wl-copy >/dev/null 2>&1; then exec wl-copy; elif command -v xclip >/dev/null 2>&1; then exec xclip -selection clipboard; else cat >/dev/null; fi'"
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "sh -c 'if command -v pbcopy >/dev/null 2>&1; then exec pbcopy; elif command -v wl-copy >/dev/null 2>&1; then exec wl-copy; elif command -v xclip >/dev/null 2>&1; then exec xclip -selection clipboard; else cat >/dev/null; fi'"

if-shell '[ -f ~/.tmux/plugins/catppuccin/tmux/catppuccin.tmux ]' 'run ~/.tmux/plugins/catppuccin/tmux/catppuccin.tmux'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_directory}"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# TPM cannot discover plugins behind the fallback if-shell in ~/.tmux.conf by scanning files.
set -g @tpm_plugins 'tmux-plugins/tpm catppuccin/tmux christoomey/vim-tmux-navigator tmux-plugins/tmux-resurrect tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-processes 'nvim lazygit'

set -g @vim_navigator_mapping_left "C-h"
set -g @vim_navigator_mapping_right "C-l"
set -g @vim_navigator_mapping_up "C-k"
set -g @vim_navigator_mapping_down "C-j"

# Clear terminal with leader + k
bind k send-keys C-l \; run-shell "sleep .3s" \; clear-history

# Open Swarm TUI in a popup
bind s display-popup -E -w 90% -h 85% "\"$SWARM_ROOT/bin/swarm\" || { printf '\\n\\nswarm failed - press Enter\\n'; IFS= read -r _; }"

# Open persistent coding agents in popups; C-q hides agent popups without stopping them
bind a display-popup -E -w 90% -h 85% "\"$SWARM_ROOT/bin/swarm\" agent claude || { printf '\\n\\nclaude popup failed - press Enter\\n'; IFS= read -r _; }"
bind A display-popup -E -w 90% -h 85% "\"$SWARM_ROOT/bin/swarm\" agent opencode || { printf '\\n\\nopencode popup failed - press Enter\\n'; IFS= read -r _; }"
bind -n C-q if -F '#{m:swarm-agent-*,#{session_name}}' 'detach-client' 'send-keys C-q'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

source-file -q ~/.swarm/tmux.local.conf
